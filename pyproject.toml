[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
asyncio_mode = "strict"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["take-home"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.13"
strict = true
show_error_codes = true
warn_unused_configs = true
exclude = ["^take-home/"]

[[tool.mypy.overrides]]
module = ["ocpp.*", "flask_wtf.*"]
ignore_missing_imports = true
